name: Bootstrap Daily Bloom

on:
  push:
    branches:
      - codex/daily-bloom
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  transform-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daily-bloom
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Daily Bloom
        run: python3 scripts/apply_daily_bloom.py
      - name: Install dependencies
        run: npm ci
      - name: Install browser runtime
        run: |
          python3 -m pip install playwright==1.54.0
          python3 -m playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Test
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600s npm test
      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html package.json src/main.ts src/style.css tests/smoke.py tests/daily-bloom-contract.mjs
          git commit -m "feat: add pressure-free Daily Bloom ritual"
          git push origin HEAD:codex/daily-bloom
