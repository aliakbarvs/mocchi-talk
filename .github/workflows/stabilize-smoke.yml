name: Stabilize Smoke Runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stabilize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/word-garden
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Stabilize smoke runtime
        run: python3 scripts/stabilize_smoke_runtime.py
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install browser runtime
        run: |
          python3 -m pip install playwright==1.54.0
          python3 -m playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Run contracts and browser smoke test
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600s npm test
      - name: Commit verified smoke stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/smoke.py
          if git diff --cached --quiet; then
            echo "Smoke runtime is already stabilized."
            exit 0
          fi
          git commit -m "test: stabilize multi-context WebGL smoke test"
          git push origin HEAD:codex/word-garden
