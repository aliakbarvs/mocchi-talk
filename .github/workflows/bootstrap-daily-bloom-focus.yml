name: Bootstrap Daily Bloom Focus

on:
  push:
    branches:
      - codex/daily-bloom
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/daily-bloom
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focus transition
        run: python3 scripts/apply_daily_bloom_focus.py
      - name: Install dependencies
        run: npm ci
      - name: Install browser runtime
        run: |
          python3 -m pip install playwright==1.54.0
          python3 -m playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Test
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 600s npm test
      - name: Commit verified focus fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts tests/smoke.py
          git commit -m "fix: preserve focus during Daily Bloom practice"
          git push origin HEAD:codex/daily-bloom
